## Appended to nuxeo.conf by the image's entrypoint when the container is created; values from environment variables.
## After editing this file (mounted from config/conf.d), recreate the container: docker compose ... up -d --force-recreate
##
## NUXEO_TEMPLATES:
## - graph-neo4j or graph-arcadedb: the repository in the graph database (each includes postgresql, for everything else);
## - sql-audit: the audit in PostgreSQL (the nuxeo-audit-sql package, installed in the image);
## - opensearch1-search-client: search and fulltext in OpenSearch (the nuxeo-search-client-opensearch1 package,
##   installed in the image); without it, the Web UI's listings and searches run in the graph database too.
nuxeo.templates=${env:NUXEO_TEMPLATES:graph-neo4j,sql-audit,opensearch1-search-client}

nuxeo.db.host=${env:NUXEO_DB_HOST:postgres}
nuxeo.db.port=${env:NUXEO_DB_PORT:5432}
nuxeo.db.name=${env:NUXEO_DB_NAME:nuxeo}
nuxeo.db.user=${env:NUXEO_DB_USER:nuxeo}
nuxeo.db.password=${env:NUXEO_DB_PASSWORD:nuxeo}

nuxeo.neo4j.uri=${env:NEO4J_URI:bolt://neo4j:7687}
nuxeo.neo4j.username=${env:NEO4J_USERNAME:neo4j}
nuxeo.neo4j.password=${env:NEO4J_PASSWORD:password}

nuxeo.arcadedb.host=${env:ARCADEDB_HOST:arcadedb}
nuxeo.arcadedb.port=${env:ARCADEDB_PORT:2480}
nuxeo.arcadedb.database=${env:ARCADEDB_DATABASE:nuxeo}
nuxeo.arcadedb.username=${env:ARCADEDB_USERNAME:root}
nuxeo.arcadedb.password=${env:ARCADEDB_PASSWORD:playwithdata}

## The search engine, OpenSearch 1.x or Elasticsearch 7/8: Nuxeo's OpenSearch 1 client works with both, with the same
## nuxeo.opensearch1.* properties (no setting tells which engine it is). In the Docker stacks, OPENSEARCH_URL is the
## stack's nuxeo-search service, whichever engine docker/.env chose. Single node: one shard, no replica.
nuxeo.opensearch1.client.server=${env:OPENSEARCH_URL:http://opensearch:9200}
## For a secured server (Elasticsearch 8 has security on by default: HTTPS and the elastic user), in a file of your own:
## nuxeo.opensearch1.client.server=https://<host>:9200
## nuxeo.opensearch1.client.username=elastic
## nuxeo.opensearch1.client.password=...
## nuxeo.opensearch1.client.trustStore.path=/path/to/truststore.p12 (with ...trustStore.password, ...trustStore.type)
## or, for a self-signed development certificate: nuxeo.opensearch1.client.sslCertificateVerification=false
nuxeo.search.client.default.opensearch1.settings.numberOfShards=1
nuxeo.search.client.default.opensearch1.settings.numberOfReplicas=0
