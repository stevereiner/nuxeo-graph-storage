## Nuxeo Stream on Kafka instead of in memory, with the audit published to Kafka: the topic nuxeo-audit-audit carries
## every document event (created, modified, removed, ...), for change sync by external consumers such as Flexible
## GraphRAG. Appended to nuxeo.conf like the other files of config/conf.d.
## KAFKA_ENABLED (true in docker/nuxeo-base.yaml): without it, Nuxeo Stream stays in memory and nothing is published.

kafka.enabled=${env:KAFKA_ENABLED:false}
kafka.bootstrap.servers=${env:KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
kafka.topicPrefix=nuxeo-
## single broker
kafka.default.replication.factor=1

## the audit goes through a stream (audit/audit): written to the audit backend (PostgreSQL) and, with Kafka, readable
## on the topic nuxeo-audit-audit
nuxeo.stream.audit.enabled=true
